name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '30 2 * * *'

# Cancel superseded runs on the same pull request. Push and scheduled runs use
# a unique group per run, so they are never cancelled.
concurrency:
  group: "${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}"
  cancel-in-progress: true

jobs:
  build-and-test:
    name: "Python ${{ matrix.python-version }} on ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        os: [ubuntu-latest]

    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
            python-version: "${{ matrix.python-version }}"
      - name: Run CI tests
        run: bash test.sh
        shell: bash
